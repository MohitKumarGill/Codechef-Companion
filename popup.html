<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>CodeChef Companion</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <img class="logo" src="icons/icon48.png" alt="CodeChef Companion" />
    <div>
      <h1>CodeChef Companion</h1>
      <p class="sub">Copy · Save · Solve · Ask</p>
    </div>
  </header>

  <section class="actions">
    <button id="ask-chatgpt" class="gpt">🤖 Ask ChatGPT</button>
    <button id="paste-clipboard" class="accent">📋 Paste clipboard to CodeChef</button>
    <button id="copy-all">📋 Copy this problem</button>
    <button id="search-github">🔍 Search GitHub</button>
    <button id="save">💾 Save to library</button>
    <button id="download">⬇️ Download bundle</button>
    <button id="paste">📥 Paste saved solution</button>
    <button id="open-library" class="primary">🗂️ Open library</button>
  </section>

  <section class="hint">
    <p><kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>V</kbd> paste clipboard · <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>A</kbd> auto-paste · <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>G</kbd> ask ChatGPT</p>
  </section>

  <section class="recent">
    <h2>Recent</h2>
    <ul id="recent-list"><li class="empty">No saved problems yet.</li></ul>
  </section>

  <footer>
    <span id="status"></span>
    <a id="open-settings" href="#" title="Settings">⚙️</a>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
